name: CI

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  pull_request:
  release:
    types: [published]

jobs:
  build-mac:
    name: "macOS"
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
    - name: Show CMake Version
      run: |
        which cmake
        cmake --version

    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install xcpretty
      run: |
        sudo gem install xcpretty

    - name: Create Project
      run: |
        cd physx
        ./generate_projects.sh mac64
    - name: Build
      run: |
        cd physx/compiler/mac64
        xcodebuild ARCHS="x86_64 arm64" VALID_ARCHS="x86_64 arm64" ONLY_ACTIVE_ARCH=NO -scheme install -configuration release build | xcpretty && exit ${PIPESTATUS[0]}

    - name: Show Result
      run: |
        cd physx
        echo "Files in bin/mac.universal/release: "
        ls -l bin/mac.universal/release
        echo "Show lipo info: "
        ls bin/mac.universal/release/*.a | xargs lipo -info

    - name: Check minos Version
      run: |
        echo "Check LC_VERSION_MIN_MACOSX ..."
        otool -l ./physx/bin/mac.universal/release/libPhysX_static_64.a | grep -A5 -B1 -m1 "LC_VERSION_MIN_MACOSX" || true
        echo "Check LC_BUILD_VERSION ..."
        otool -l ./physx/bin/mac.universal/release/libPhysX_static_64.a | grep -A5 -B1 -m1 "LC_BUILD_VERSION" || true

    - name: Upload Artifact (.a)
      uses: actions/upload-artifact@v4
      with:
        name: mac-universal
        path: physx/bin/mac.universal/release/*.a

    - name: Upload Artifact (.h)
      uses: actions/upload-artifact@v4
      with:
        name: cpp-header-unix
        path: physx/install/mac64/*

    - name: Pack dist files (.a)
      if: github.event_name == 'release'
      uses: thedoctor0/zip-release@main
      with:
        type: 'zip'
        directory: 'physx/bin/mac.universal/release'
        path: '.'
        filename: 'physx-${{ github.event.release.tag_name }}-mac.zip'

    - name: Upload to Release (.a)
      if: github.event_name == 'release'
      uses: svenstaro/upload-release-action@04733e069f2d7f7f0b4aebc4fbdbce8613b03ccd
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: physx/bin/mac.universal/release/physx-${{ github.event.release.tag_name }}-mac.zip
        asset_name: physx-${{ github.event.release.tag_name }}-mac.zip
        tag: ${{ github.ref }}

  build-ios:
    name: "iOS"
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - { sdk: iphoneos, arch: arm64, toolchain: OS64 }
          - { sdk: iphonesimulator, arch: x86_64, toolchain: SIMULATOR64 }
          - { sdk: iphonesimulator, arch: arm64, toolchain: SIMULATORARM64 }
    steps:
    - name: Show CMake Version
      run: |
        which cmake
        cmake --version
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install xcpretty
      run: |
        sudo gem install xcpretty

    - name: Create Project
      run: |
        cd physx
        ./generate_projects.sh ios64 ${{ matrix.config.toolchain }}

    - name: Build
      run: |
        cd physx/compiler/ios64
        xcodebuild ARCHS="${{ matrix.config.arch }}" VALID_ARCHS="${{ matrix.config.arch }}" ONLY_ACTIVE_ARCH=NO -sdk ${{ matrix.config.sdk }} -scheme install -configuration release build | xcpretty && exit ${PIPESTATUS[0]}

    - name: Show Result
      run: |
        cd physx
        echo "Files in bin/ios.arm_64/release: "
        ls -l bin/ios.arm_64/release
        echo "Show lipo info: "
        ls bin/ios.arm_64/release/*.a | xargs lipo -info

    - name: Check minos Version
      run: |
        echo "Check LC_VERSION_MIN_IPHONEOS ..."
        otool -l ./physx/bin/ios.arm_64/release/libPhysX_static_64.a | grep -A5 -B1 -m1 "LC_VERSION_MIN_IPHONEOS" || true
        echo "Check LC_BUILD_VERSION ..."
        otool -l ./physx/bin/ios.arm_64/release/libPhysX_static_64.a | grep -A5 -B1 -m1 "LC_BUILD_VERSION" || true

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-${{ matrix.config.sdk }}-${{ matrix.config.arch }}
        path: physx/bin/ios.arm_64/release/*.a

  create-fat-library:
    name: "Create iOS Fat Library"
    runs-on: macos-latest
    permissions:
      contents: write
    needs: build-ios
    steps:
    - name: Download iOS Artifacts (ios-iphoneos-arm64)
      uses: actions/download-artifact@v4
      with:
        name: ios-iphoneos-arm64
        path: artifacts/ios-iphoneos-arm64

    - name: Download iOS Artifacts (ios-iphonesimulator-x86_64)
      uses: actions/download-artifact@v4
      with:
        name: ios-iphonesimulator-x86_64
        path: artifacts/ios-iphonesimulator-x86_64

    - name: Download iOS Artifacts (ios-iphonesimulator-arm64)
      uses: actions/download-artifact@v4
      with:
        name: ios-iphonesimulator-arm64
        path: artifacts/ios-iphonesimulator-arm64

    - name: Create Fat Library
      run: |
        dir1="artifacts/ios-iphoneos-arm64"
        dir2="artifacts/ios-iphonesimulator-x86_64"
        output_dir="artifacts/ios-fat"

        mkdir -p "$output_dir"

        for file in "$dir1"/*.a; do
          filename=$(basename "$file")
          if [[ -f "$dir2/$filename" ]]; then
              lipo -create "$file" "$dir2/$filename" -output "$output_dir/$filename"
              echo "Created fat library: $output_dir/$filename"
          else
              echo "Skipping $filename: No matching file in $dir2"
          fi
        done

    - name: Upload Fat Library
      uses: actions/upload-artifact@v4
      with:
        name: ios-fat
        path: artifacts/ios-fat

    - uses: geekyeggo/delete-artifact@v5
      with:
        name: ios-iphoneos-arm64

    - uses: geekyeggo/delete-artifact@v5
      with:
        name: ios-iphonesimulator-x86_64

    - name: Remove local ios-iphoneos-arm64 & ios-iphonesimulator-x86_64
      run: |
        rm -rf artifacts/ios-iphoneos-arm64
        rm -rf artifacts/ios-iphonesimulator-x86_64

    - name: Pack dist files
      if: github.event_name == 'release'
      uses: thedoctor0/zip-release@main
      with:
        type: 'zip'
        directory: 'artifacts'
        path: '.'
        filename: 'physx-${{ github.event.release.tag_name }}-ios.zip'

    - name: Upload to Release
      if: github.event_name == 'release'
      uses: svenstaro/upload-release-action@04733e069f2d7f7f0b4aebc4fbdbce8613b03ccd
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: artifacts/physx-${{ github.event.release.tag_name }}-ios.zip
        asset_name: physx-${{ github.event.release.tag_name }}-ios.zip
        tag: ${{ github.ref }}

  build-android:
    name: "android"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - { arch: armeabi-v7a }
          - { arch: arm64-v8a }
          - { arch: x86 }
          - { arch: x86_64 }

    steps:
    - name: Show CMake Version
      run: |
        which cmake
        cmake --version
    - uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r21e
        add-to-path: false
        local-cache: true

    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Create Project
      run: |
        export PM_AndroidNDK_PATH=${{ steps.setup-ndk.outputs.ndk-path }}
        cd physx
        ./generate_projects.sh android-${{ matrix.config.arch }}

    - name: Build
      run: |
        cd physx/compiler/android-${{ matrix.config.arch }}-release
        cpu_count=$(nproc)
        VERBOSE=1 make -j${cpu_count}

    - name: Show Result
      run: |
        cd physx
        echo "Files in bin/android.${{ matrix.config.arch }}.fp-soft/release: "
        ls -l bin/android.${{ matrix.config.arch }}.fp-soft/release

    - name: Upload Artifact (.a)
      uses: actions/upload-artifact@v4
      with:
        name: android-${{ matrix.config.arch }}
        path: physx/bin/android.${{ matrix.config.arch }}.fp-soft/release/*.a

  create-android-package:
    if: github.event_name == 'release'
    name: "create-android-package"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: build-android
    steps:
    - name: Download android Artifacts (android-armeabi-v7a)
      uses: actions/download-artifact@v4
      with:
        name: android-armeabi-v7a
        path: artifacts/armeabi-v7a

    - name: Download android Artifacts (android-arm64-v8a)
      uses: actions/download-artifact@v4
      with:
        name: android-arm64-v8a
        path: artifacts/arm64-v8a

    - name: Download android Artifacts (android-x86)
      uses: actions/download-artifact@v4
      with:
        name: android-x86
        path: artifacts/x86

    - name: Download android Artifacts (android-x86_64)
      uses: actions/download-artifact@v4
      with:
        name: android-x86_64
        path: artifacts/x86_64

    - name: Pack dist files
      if: github.event_name == 'release'
      uses: thedoctor0/zip-release@main
      with:
        type: 'zip'
        directory: 'artifacts'
        path: '.'
        filename: 'physx-${{ github.event.release.tag_name }}-android.zip'

    - name: Upload to Release
      if: github.event_name == 'release'
      uses: svenstaro/upload-release-action@04733e069f2d7f7f0b4aebc4fbdbce8613b03ccd
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: artifacts/physx-${{ github.event.release.tag_name }}-android.zip
        asset_name: physx-${{ github.event.release.tag_name }}-android.zip
        tag: ${{ github.ref }}

  build-openharmony:
    name: "openharmony"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - { arch: armeabi-v7a }
          - { arch: arm64-v8a }
          - { arch: x86_64 }

    steps:
    - name: Show CMake Version
      run: |
        which cmake
        cmake --version
    - name: Get oh sdk cache directory path
      id: oh-sdk-cache-dir-path
      run: |
        echo "cache dir: "
        echo "dir=$HOME/openharmony" >> $GITHUB_OUTPUT

    - name: Output cache dir
      run: |
        echo "Output cache dir: ${{ steps.oh-sdk-cache-dir-path.outputs.dir }}"

    - name: Cache OH SDK
      id: cache-oh-sdk
      uses: actions/cache@v4
      env:
        cache-name: cache-oh-sdk-13
      with:
        path: ${{ steps.oh-sdk-cache-dir-path.outputs.dir }}
        key: ${{ runner.os }}-build-${{ env.cache-name }}

    - name: No Cache found, install oh sdk
      if: ${{ steps.cache-oh-sdk.outputs.cache-hit != 'true' }}
      continue-on-error: false
      run: |
        if [ ! -d "$HOME/openharmony" ]; then
        mkdir -p $HOME/openharmony
        echo "Download commandline-tools-linux-x64-5.0.7.200.zip ..."
        wget -q https://github.com/dumganhar/oh-sdk-for-ci/releases/download/api-13/commandline-tools-linux-x64-5.0.7.200.zip.001
        wget -q https://github.com/dumganhar/oh-sdk-for-ci/releases/download/api-13/commandline-tools-linux-x64-5.0.7.200.zip.002
        echo "Unzip commandline-tools-linux-x64-5.0.7.200.zip ..."
        7z x commandline-tools-linux-x64-5.0.7.200.zip.001 -o$HOME/openharmony > /dev/null
        cd $HOME/openharmony
        ls -l
        cd commandline-tools-linux-x64-5.0.7.200
        ls -l
        fi

    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Create Project
      run: |
        export PM_OpenHarmonyNDK_PATH=$HOME/openharmony/commandline-tools-linux-x64-5.0.7.200/sdk/default/openharmony/native
        cd physx
        ./generate_projects.sh openharmony-${{ matrix.config.arch }}

    - name: Build
      run: |
        export PATH=$HOME/openharmony/commandline-tools-linux-x64-5.0.7.200/sdk/default/openharmony/native/build-tools/cmake/bin:$PATH
        cd physx/compiler/openharmony-${{ matrix.config.arch }}-release
        ninja

    - name: Show Result
      run: |
        cd physx
        echo "Files in bin/openharmony.${{ matrix.config.arch }}/release: "
        ls -l bin/openharmony.${{ matrix.config.arch }}/release

    - name: Upload Artifact (.a)
      uses: actions/upload-artifact@v4
      with:
        name: openharmony-${{ matrix.config.arch }}
        path: physx/bin/openharmony.${{ matrix.config.arch }}/release/*.a

  create-openharmony-package:
    if: github.event_name == 'release'
    name: "create-openharmony-package"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: build-openharmony
    steps:
    - name: Download openharmony Artifacts (openharmony-armeabi-v7a)
      uses: actions/download-artifact@v4
      with:
        name: openharmony-armeabi-v7a
        path: artifacts/armeabi-v7a

    - name: Download openharmony Artifacts (openharmony-arm64-v8a)
      uses: actions/download-artifact@v4
      with:
        name: openharmony-arm64-v8a
        path: artifacts/arm64-v8a

    - name: Download openharmony Artifacts (openharmony-x86_64)
      uses: actions/download-artifact@v4
      with:
        name: openharmony-x86_64
        path: artifacts/x86_64

    - name: Pack dist files
      if: github.event_name == 'release'
      uses: thedoctor0/zip-release@main
      with:
        type: 'zip'
        directory: 'artifacts'
        path: '.'
        filename: 'physx-${{ github.event.release.tag_name }}-openharmony.zip'

    - name: Upload to Release
      if: github.event_name == 'release'
      uses: svenstaro/upload-release-action@04733e069f2d7f7f0b4aebc4fbdbce8613b03ccd
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: artifacts/physx-${{ github.event.release.tag_name }}-openharmony.zip
        asset_name: physx-${{ github.event.release.tag_name }}-openharmony.zip
        tag: ${{ github.ref }}

  build-windows:
    name: "windows"
    runs-on: windows-2019
    strategy:
      fail-fast: false
      matrix:
        config:
          - { preset: vc16win64-debug, buildtype: debug, runtime: md }
          - { preset: vc16win64, buildtype: release, runtime: md }

    permissions:
      contents: write
    steps:
    - name: Find Visual Studio Installation Path with vswhere
      id: vswhere
      run: |
        $vsPath = &vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        echo "vsPath=$vsPath" >> $env:GITHUB_ENV

    - name: Find dumpbin.exe Path
      id: find-dumpbin
      run: |
        $dumpbinPath = "$env:vsPath\VC\Tools\MSVC"
        $dumpbinPath = Get-ChildItem -Path $dumpbinPath -Directory | Sort-Object Name -Descending | Select-Object -First 1 | ForEach-Object { "$($_.FullName)\bin\Hostx64\x64\dumpbin.exe" }
        if (-not (Test-Path $dumpbinPath)) {
        throw "dumpbin.exe not found"
        }
        echo "dumpbinPath=$dumpbinPath"
        echo "dumpbinPath=$dumpbinPath" >> $env:GITHUB_ENV

    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Create Windows dist directory
      shell: bash
      run: |
        mkdir dist-windows
        rm -rf physx/bin

    - name: Create Project
      shell: cmd
      run: |
        cd physx
        generate_projects.bat ${{ matrix.config.preset }}

    - name: Build
      shell: bash
      run: |
        cd physx
        cd compiler/${{ matrix.config.preset }}
        cmake --build . --target install --config ${{ matrix.config.buildtype }}

    - name: Show Result
      shell: bash
      run: |
        echo "Files in bin/win.x86_64.vc142.${{ matrix.config.runtime }}/${{ matrix.config.buildtype }}: "
        ls -l physx/install/${{ matrix.config.preset }}/PhysX/bin/win.x86_64.vc142.${{ matrix.config.runtime }}/${{ matrix.config.buildtype }}
        rm -f physx/install/${{ matrix.config.preset }}/PhysX/bin/win.x86_64.vc142.${{ matrix.config.runtime }}/${{ matrix.config.buildtype }}/*.pdb
        cp physx/install/${{ matrix.config.preset }}/PhysX/bin/win.x86_64.vc142.${{ matrix.config.runtime }}/${{ matrix.config.buildtype }}/* dist-windows/
        echo "Show files in dist-windows:"
        ls -l dist-windows/
        echo "Remove bin directory since it should not be included in header artifact..."
        rm -rf physx/install/${{ matrix.config.preset }}/PhysX/bin

    - name: Upload Artifact (.lib)
      uses: actions/upload-artifact@v4
      with:
        name: win64-${{ matrix.config.buildtype }}
        path: dist-windows/*

    - name: Upload Artifact (.h)
      uses: actions/upload-artifact@v4
      if: ${{ matrix.config.buildtype == 'release' }}
      with:
        name: cpp-header-windows
        path: physx/install/${{ matrix.config.preset }}/*

  create-windows-package:
    if: github.event_name == 'release'
    name: "create-windows-package"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: build-windows
    steps:
    - name: Download windows Artifacts (debug)
      uses: actions/download-artifact@v4
      with:
        name: win64-debug
        path: artifacts/win64-debug

    - name: Download windows Artifacts (release)
      uses: actions/download-artifact@v4
      with:
        name: win64-release
        path: artifacts/win64-release

    - name: Pack dist files
      if: github.event_name == 'release'
      uses: thedoctor0/zip-release@main
      with:
        type: 'zip'
        directory: 'artifacts'
        path: '.'
        filename: 'physx-${{ github.event.release.tag_name }}-win64.zip'

    - name: Upload to Release
      if: github.event_name == 'release'
      uses: svenstaro/upload-release-action@04733e069f2d7f7f0b4aebc4fbdbce8613b03ccd
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: artifacts/physx-${{ github.event.release.tag_name }}-win64.zip
        asset_name: physx-${{ github.event.release.tag_name }}-win64.zip
        tag: ${{ github.ref }}

  create-header:
    name: create-header
    runs-on: ubuntu-latest
    needs: [build-mac, build-windows]
    permissions:
      contents: write
    steps:
    - name: Install dos2unix
      run: |
        sudo apt install dos2unix

    - name: Download cpp-header Artifacts (unix)
      uses: actions/download-artifact@v4
      with:
        name: cpp-header-unix
        path: artifacts/cpp-header-unix

    - name: Download cpp-header Artifacts (windows)
      uses: actions/download-artifact@v4
      with:
        name: cpp-header-windows
        path: artifacts/cpp-header-windows

    - name: Merge Headers
      run: |
        mkdir -p artifacts/merged-headers
        rsync -av --ignore-existing artifacts/cpp-header-windows/ artifacts/merged-headers/
        rsync -av --ignore-existing artifacts/cpp-header-unix/ artifacts/merged-headers/
        echo "Fix line endings ..."
        find artifacts/merged-headers -type f -exec dos2unix {} \;

    - name: Upload Merged Headers Artifact
      uses: actions/upload-artifact@v4
      with:
        name: cpp-headers
        path: artifacts/merged-headers

    - name: Pack dist files (.h)
      if: github.event_name == 'release'
      uses: thedoctor0/zip-release@main
      with:
        type: 'zip'
        directory: 'artifacts/merged-headers'
        path: '.'
        filename: 'physx-${{ github.event.release.tag_name }}-header.zip'

    - name: Upload to Release (.h)
      if: github.event_name == 'release'
      uses: svenstaro/upload-release-action@04733e069f2d7f7f0b4aebc4fbdbce8613b03ccd
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: artifacts/merged-headers/physx-${{ github.event.release.tag_name }}-header.zip
        asset_name: physx-${{ github.event.release.tag_name }}-header.zip
        tag: ${{ github.ref }}

  build-emscripten:
    name: emscripten
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout EMSDK
        uses: actions/checkout@v4
        with:
          repository: emscripten-core/emsdk
          path: emsdk

      - name: Setup EMSDK
        run: |
          sudo apt-get install python3
          sudo apt-get install git
          cd emsdk
          ./emsdk install 3.1.41
          ./emsdk activate 3.1.41
          source ./emsdk_env.sh
          # Verify
          emcc -v

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Build
        run: |
          # Setup EMSDK env
          source emsdk/emsdk_env.sh
          export EMSCRIPTEN="$EMSDK/upstream/emscripten"
          echo "Start release build"
          ./build-emscripten.sh
          echo "Build finished"

      - name: Show Result
        run: |
          ls -l builds

      - name: Upload Artifact (wasm/asmjs)
        uses: actions/upload-artifact@v4
        with:
          name: emscripten
          path: builds

      - name: Pack dist files
        if: github.event_name == 'release'
        uses: thedoctor0/zip-release@main
        with:
          type: 'zip'
          directory: 'builds'
          path: '.'
          filename: 'physx-${{ github.event.release.tag_name }}-emscripten.zip'

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@04733e069f2d7f7f0b4aebc4fbdbce8613b03ccd
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: builds/physx-${{ github.event.release.tag_name }}-emscripten.zip
          asset_name: physx-${{ github.event.release.tag_name }}-emscripten.zip
          tag: ${{ github.ref }}
